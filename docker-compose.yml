# ============================================================
# FinCore Banking — Docker Compose
# Infraestrutura completa: PostgreSQL, Kafka, 5 microsserviços
# ============================================================
# Uso:
#   cp .env.example .env && nano .env
#   docker compose up -d
#   docker compose --profile dev up -d   (inclui pgAdmin)
# ============================================================

services:

  # ------------------------------------------------------------
  # PostgreSQL 16 — banco de dados principal
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fincore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:               ${POSTGRES_USER}
      POSTGRES_PASSWORD:           ${POSTGRES_PASSWORD}
      POSTGRES_DB:                 postgres
      PGDATA:                      /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD:   md5
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fincore-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # Zookeeper — coordenação do Kafka
  # ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fincore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    networks:
      - fincore-internal

  # ------------------------------------------------------------
  # Kafka — mensageria assíncrona
  # Dois listeners:
  #   INTERNAL (kafka:29092) — container-to-container
  #   EXTERNAL (localhost:9092) — acesso do host (dev local)
  # ------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fincore-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:       PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168
    ports:
      - "9092:9092"
    networks:
      - fincore-internal

  # ============================================================
  # MICROSSERVIÇOS JAVA
  # Ordem de inicialização:
  #   1. postgres + zookeeper + kafka (infraestrutura)
  #   2. auth-service
  #   3. account-service + fraud-service
  #   4. transaction-service
  #   5. notification-service
  # ============================================================

  # ------------------------------------------------------------
  # auth-service — autenticação e JWT (porta 8081)
  # ------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: fincore/auth-service:latest
    container_name: fincore-auth
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME:  ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD:  ${AUTH_DB_PASSWORD}
      JWT_SECRET:                  ${JWT_SECRET}
      JWT_EXPIRATION:              ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION:      ${JWT_REFRESH_EXPIRATION}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - fincore-internal
      - fincore-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------
  # account-service — contas bancárias e depósitos (porta 8082)
  # ------------------------------------------------------------
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    image: fincore/account-service:latest
    container_name: fincore-account
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/${ACCOUNT_DB_NAME}
      SPRING_DATASOURCE_USERNAME:  ${ACCOUNT_DB_USER}
      SPRING_DATASOURCE_PASSWORD:  ${ACCOUNT_DB_PASSWORD}
      JWT_SECRET:                  ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS:     kafka:29092
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - fincore-internal
      - fincore-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------
  # transaction-service — PIX e transferências (porta 8083)
  # ------------------------------------------------------------
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    image: fincore/transaction-service:latest
    container_name: fincore-transaction
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/${TXN_DB_NAME}
      SPRING_DATASOURCE_USERNAME:  ${TXN_DB_USER}
      SPRING_DATASOURCE_PASSWORD:  ${TXN_DB_PASSWORD}
      JWT_SECRET:                  ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS:     kafka:29092
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - fincore-internal
      - fincore-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------
  # notification-service — notificações de eventos (porta 8084)
  # ------------------------------------------------------------
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: fincore/notification-service:latest
    container_name: fincore-notification
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME:  ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD:  ${NOTIFICATION_DB_PASSWORD}
      JWT_SECRET:                  ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS:     kafka:29092
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - fincore-internal
      - fincore-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------
  # fraud-service — detecção de fraude em tempo real (porta 8085)
  # ------------------------------------------------------------
  fraud-service:
    build:
      context: ./fraud-service
      dockerfile: Dockerfile
    image: fincore/fraud-service:latest
    container_name: fincore-fraud
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:       jdbc:postgresql://postgres:5432/${FRAUD_DB_NAME}
      SPRING_DATASOURCE_USERNAME:  ${FRAUD_DB_USER}
      SPRING_DATASOURCE_PASSWORD:  ${FRAUD_DB_PASSWORD}
      JWT_SECRET:                  ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS:     kafka:29092
      FRAUD_MAX_AMOUNT:            ${FRAUD_MAX_AMOUNT}
      FRAUD_MAX_DAILY_TRANSACTIONS: ${FRAUD_MAX_DAILY_TRANSACTIONS}
      FRAUD_SUSPICIOUS_AMOUNT:     ${FRAUD_SUSPICIOUS_AMOUNT}
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - fincore-internal
      - fincore-external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------------------------
  # pgAdmin — interface visual do PostgreSQL (só em dev)
  # Ative com: docker compose --profile dev up -d
  # ------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fincore-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL:                   admin@fincore.com
      PGADMIN_DEFAULT_PASSWORD:                pgAdmin#2024!
      PGADMIN_CONFIG_SERVER_MODE:              "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fincore-internal
    depends_on:
      postgres:
        condition: service_healthy

# ============================================================
# Redes — isolamento de tráfego
# fincore-internal: comunicação entre serviços (sem acesso externo)
# fincore-external: serviços expostos ao host / cliente
# ============================================================
networks:
  fincore-internal:
    driver: bridge
    name: fincore-internal
  fincore-external:
    driver: bridge
    name: fincore-external

# ============================================================
# Volumes persistentes
# ============================================================
volumes:
  postgres_data:
    name: fincore-postgres-data
  pgadmin_data:
    name: fincore-pgadmin-data
